<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forest Shooter TPS - Ultimate Final v2</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: #020a02; 
            font-family: 'Segoe UI', sans-serif; color: white; 
            touch-action: none; user-select: none;
        }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .hud-text { position: absolute; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 6px rgba(0,0,0,0.9); letter-spacing: 1px; }
        #score-display { top: 20px; left: 20px; color: #fff; }
        #level-display { top: 20px; right: 20px; color: #ffd700; }

        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 5, 0, 0.92); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 10; text-align: center;
        }
        h1 { color: #4caf50; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 30px; text-shadow: 0 0 20px #4caf50; font-size: 42px; }
        .menu-btn {
            display: block; width: 320px; padding: 18px 0; margin: 10px 0;
            font-size: 20px; font-weight: bold; color: white;
            background: linear-gradient(to bottom, #2e7d32, #1b5e20);
            border: 2px solid #4caf50; border-radius: 8px;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 0 #0d3b10;
        }
        .menu-btn:hover { background: linear-gradient(to bottom, #388e3c, #2e7d32); transform: translateY(-2px); }
        .menu-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0d3b10; }
        .btn-exit { background: linear-gradient(to bottom, #c62828, #b71c1c); border-color: #ef5350; box-shadow: 0 4px 0 #7f0000; }
        .btn-exit:hover { background: linear-gradient(to bottom, #d32f2f, #c62828); }
        .menu-subtext { color: #aaa; margin-top: 20px; font-size: 14px; line-height: 1.6; }
        .key-badge { display: inline-block; background: #1a3a1a; padding: 4px 10px; border-radius: 4px; margin: 0 3px; font-family: monospace; border-bottom: 2px solid #0a1f0a; color: #8bc34a; }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<body>

<div id="ui-layer">
    <div id="score-display" class="hud-text">SKOR: 0</div>
    <div id="level-display" class="hud-text">LEVEL: 1</div>
</div>

<div id="menu-screen">
    <h1 id="menu-title">FOREST SHOOTER</h1>

    <div class="menu-subtext">
        <span class="key-badge">WASD</span> Gerak | <span class="key-badge">MOUSE</span> Putar Kamera<br>
        <span class="key-badge">KLIK KIRI</span> Tembak | <span class="key-badge">ESC</span> Jeda/Lanjut
    </div>
</div>

<script type="module">
import * as THREE from 'three';

// --- AUDIO SYSTEM (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let bgmOscillators = [];

function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    
    if(type === 'shoot') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'enemy_hit') {
        osc.type = 'square'; osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.1);
        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'player_hurt') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.2);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'enemy_groan') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(80 + Math.random()*40, now);
        osc.frequency.linearRampToValueAtTime(60 + Math.random()*20, now + 0.4);
        gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
    }
}

function startBGM() {
    stopBGM();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const createDrone = (freq, vol) => {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = freq; gain.gain.value = vol;
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start();
        return {osc, gain};
    };
    bgmOscillators.push(createDrone(55, 0.08));
    bgmOscillators.push(createDrone(82.5, 0.05));
    bgmOscillators.push(createDrone(110, 0.03));
}
function stopBGM() {
    bgmOscillators.forEach(o => { o.osc.stop(); o.osc.disconnect(); });
    bgmOscillators = [];
}

// --- TEKSTUR PROCEDURAL ---
function createNoiseTexture(w, h, baseColor, noiseInt) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = baseColor; ctx.fillRect(0,0,w,h);
    for(let i=0; i<w*h*0.3; i++){
        const x=Math.random()*w, y=Math.random()*h, s=Math.random()*2+0.5;
        ctx.fillStyle=`rgba(0,0,0,${Math.random()*noiseInt})`; ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2); ctx.fill();
        ctx.fillStyle=`rgba(255,255,255,${Math.random()*noiseInt*0.4})`; ctx.beginPath(); ctx.arc(x+1,y+1,s*0.5,0,Math.PI*2); ctx.fill();
    }
    return new THREE.CanvasTexture(c);
}
function createPlankTexture() {
    const c=document.createElement('canvas'); c.width=128; c.height=256; const ctx=c.getContext('2d');
    ctx.fillStyle='#3e2723'; ctx.fillRect(0,0,128,256);
    const plankWidth = 14;
    for(let i=0; i<8; i++) {
        const x = (i * 16) + 4;
        ctx.strokeStyle='rgba(10,5,2,0.9)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(x-2,0); ctx.lineTo(x-2,256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x+plankWidth+2,0); ctx.lineTo(x+plankWidth+2,256); ctx.stroke();
        for(let j=0; j<15; j++) {
            ctx.strokeStyle=`rgba(60,30,15,${Math.random()*0.5})`; ctx.lineWidth=Math.random()*2+0.5;
            ctx.beginPath(); const startX=x+Math.random()*plankWidth; 
            ctx.moveTo(startX, Math.random()*256); ctx.lineTo(startX+(Math.random()-0.5)*4, Math.random()*256); ctx.stroke();
        }
    }
    const tex = new THREE.CanvasTexture(c); tex.wrapS = THREE.RepeatWrapping; tex.repeat.set(1, 2);
    return tex;
}

// --- SETUP SCENE ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020a02);
scene.fog = new THREE.FogExp2(0x020a02, 0.012);
const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.BasicShadowMap;
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffeebb, 1.2);
dirLight.position.set(25, 35, 20); dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5; dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -60; dirLight.shadow.camera.right = 60;
dirLight.shadow.camera.top = 60; dirLight.shadow.camera.bottom = -60;
scene.add(dirLight);

const grassTex = createNoiseTexture(256, 256, '#0a3a0a', 0.15);
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(20, 20);
const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9 });
const plankTex = createPlankTexture();
const houseWallMat = new THREE.MeshStandardMaterial({ map: plankTex, roughness: 0.9 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x2d1b15, roughness: 0.95 });

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), groundMat);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

// --- COLLISION SYSTEM SEGMENT LINEAR (ANTI TEMBUS 100%) ---
const wallSegments = []; // Format: {p1: Vector2, p2: Vector2}

function addWallSegment(x, z, rotY, x1, z1, x2, z2) {
    const cosR = Math.cos(rotY), sinR = Math.sin(rotY);
    const p1 = new THREE.Vector2(x + x1*cosR - z1*sinR, z + x1*sinR + z1*cosR);
    const p2 = new THREE.Vector2(x + x2*cosR - z2*sinR, z + x2*sinR + z2*cosR);
    wallSegments.push({p1, p2});
}

function checkWall(nx, nz, pr=0.5){
    const playerPos = new THREE.Vector2(nx, nz);
    for(const seg of wallSegments) {
        // Hitung jarak titik ke garis segmen
        const l2 = seg.p1.distanceToSquared(seg.p2);
        if (l2 === 0) continue;
        let t = ((playerPos.x - seg.p1.x) * (seg.p2.x - seg.p1.x) + (playerPos.y - seg.p1.y) * (seg.p2.y - seg.p1.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        const projX = seg.p1.x + t * (seg.p2.x - seg.p1.x);
        const projY = seg.p1.y + t * (seg.p2.y - seg.p1.y);
        const dist = Math.sqrt((nx - projX)**2 + (nz - projY)**2);
        if(dist < pr) return true;
    }
    if(Math.abs(nx)>60 || Math.abs(nz)>60) return true;
    return false;
}

function createSolidTree(x, z) {
    const g = new THREE.Group(); g.position.set(x,0,z);
    const tH=4+Math.random()*2, tR=0.5+Math.random()*0.3;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(tR*0.7,tR,tH,6),houseWallMat);
    trunk.position.y=tH/2; trunk.castShadow=true; trunk.receiveShadow=true; g.add(trunk);
    const lH=3+Math.random()*2, lR=1.5+Math.random()*0.8;
    const leaves=new THREE.Mesh(new THREE.ConeGeometry(lR,lH,6),new THREE.MeshStandardMaterial({color:0x1b5e20}));
    leaves.position.y=tH+lH/2-0.8; leaves.castShadow=true; leaves.receiveShadow=true; g.add(leaves);
    scene.add(g); 
    // Tree collision tetap pakai radius karena bentuknya bulat
    // Kita tambahkan juga sebagai segmen pendek untuk konsistensi (opsional, tapi radius lebih efisien untuk pohon)
    // Untuk simplifikasi, kita gunakan pendekatan hybrid: pohon pakai radius, rumah pakai segmen
    // Tapi agar fungsi checkWall tetap kompatibel, kita simpan pohon sebagai segmen lingkaran diskrit
    const sides = 8;
    for(let i=0; i<sides; i++) {
        const a1 = (i/sides)*Math.PI*2, a2 = ((i+1)/sides)*Math.PI*2;
        addWallSegment(x, z, 0, Math.cos(a1)*(tR+0.4), Math.sin(a1)*(tR+0.4), Math.cos(a2)*(tR+0.4), Math.sin(a2)*(tR+0.4));
    }
}

// RUMAH KAYU RAKSASA DENGAN SEGMENT WALL PERFECT
function createHouse(x, z, rotY) {
    const g = new THREE.Group(); g.position.set(x,0,z); g.rotation.y = rotY;
    const W = 18, D = 12, H = 5.5; 
    
    const floor = new THREE.Mesh(new THREE.BoxGeometry(W, 0.2, D), houseWallMat);
    floor.position.y=0.1; floor.receiveShadow=true; g.add(floor);
    
    const back = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.3), houseWallMat);
    back.position.set(0, H/2, -D/2); back.castShadow=true; g.add(back);
    const left = new THREE.Mesh(new THREE.BoxGeometry(0.3, H, D), houseWallMat);
    left.position.set(-W/2, H/2, 0); left.castShadow=true; g.add(left);
    const right = new THREE.Mesh(new THREE.BoxGeometry(0.3, H, D), houseWallMat);
    right.position.set(W/2, H/2, 0); right.castShadow=true; g.add(right);
    
    // PINTU LEBAR 4.5 UNIT
    const doorW = 4.5, doorH = 3.8;
    const sideW = (W - doorW) / 2; // 6.75
    
    const frontL = new THREE.Mesh(new THREE.BoxGeometry(sideW, H, 0.3), houseWallMat);
    frontL.position.set(-W/2 + sideW/2, H/2, D/2); frontL.castShadow=true; g.add(frontL);
    const frontR = new THREE.Mesh(new THREE.BoxGeometry(sideW, H, 0.3), houseWallMat);
    frontR.position.set(W/2 - sideW/2, H/2, D/2); frontR.castShadow=true; g.add(frontR);
    const frontTop = new THREE.Mesh(new THREE.BoxGeometry(doorW, H - doorH, 0.3), houseWallMat);
    frontTop.position.set(0, doorH + (H-doorH)/2, D/2); frontTop.castShadow=true; g.add(frontTop);
    
    const roofGeo = new THREE.ConeGeometry(Math.max(W,D)*0.85, 6, 4);
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = H + 3; roof.rotation.y = Math.PI/4; roof.scale.z = 0.9; roof.castShadow=true; g.add(roof);
    scene.add(g);
    
    // SEGMENT WALL TANPA CELAH
    // Dinding Belakang
    addWallSegment(x, z, rotY, -W/2, -D/2, W/2, -D/2);
    // Dinding Kiri
    addWallSegment(x, z, rotY, -W/2, -D/2, -W/2, D/2);
    // Dinding Kanan
    addWallSegment(x, z, rotY, W/2, -D/2, W/2, D/2);
    // Dinding Depan Kiri Pintu
    addWallSegment(x, z, rotY, -W/2, D/2, -W/2 + sideW, D/2);
    // Dinding Depan Kanan Pintu
    addWallSegment(x, z, rotY, W/2 - sideW, D/2, W/2, D/2);
    // Balok Atas Pintu
    addWallSegment(x, z, rotY, -doorW/2, D/2, doorW/2, D/2);
}

// Generate Map
for(let i=0; i<90; i++){
    const x=(Math.random()-0.5)*140, z=(Math.random()-0.5)*140;
    if(Math.abs(x)<12 && Math.abs(z)<12) continue;
    createSolidTree(x, z);
}
createHouse(-30, -30, 0);
createHouse(30, -25, Math.PI/3);
createHouse(-25, 30, -Math.PI/4);
createHouse(28, 28, Math.PI/2);
createHouse(0, -35, 0);
createHouse(-35, 0, Math.PI);

// --- STATE MANAGEMENT ---
let gameState = 'MENU'; 
let score=0, level=1, lastSpawnTime=0, spawnRate=2000;
const input = {up:false, down:false, left:false, right:false, shoot:false};
let camYaw = 0;
const mouseDelta = { x: 0 };
const CAM_SENSITIVITY = 0.0015;
let player, bullets=[], enemies=[];

// BAR DARAH TIPIS & DINAMIS
function createHealthBar(isPlayer) {
    const canvas = document.createElement('canvas');
    canvas.width = 90; canvas.height = 12; // Lebih tipis
    const ctx = canvas.getContext('2d');
    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(1.8, 0.3, 1); // Skala kecil agar tidak ganggu pandangan
    return { sprite, canvas, ctx, isPlayer, maxHP: isPlayer ? 3 : 2, currentHP: isPlayer ? 3 : 2 };
}

function updateHealthBar(hb, hp) {
    hb.currentHP = hp;
    const ratio = hp / hb.maxHP;
    const fillW = Math.floor(86 * ratio); // 86 = 90 - 4px padding
    
    // Background hitam
    hb.ctx.fillStyle = '#111';
    hb.ctx.fillRect(0, 0, 90, 12);
    
    // Warna dinamis
    let color = '#4caf50'; // Hijau default
    if(hb.isPlayer) {
        if(ratio <= 0.34) color = '#f44336'; // Merah (1/3 sisa)
        else if(ratio <= 0.67) color = '#ff9800'; // Oranye (2/3 sisa)
    } else {
        if(ratio <= 0.5) color = '#ff9800'; // Musuh oranye kalau setengah
    }
    
    // Isi bar
    hb.ctx.fillStyle = color;
    hb.ctx.fillRect(2, 2, fillW, 8);
    
    // Border tipis
    hb.ctx.strokeStyle = '#000';
    hb.ctx.lineWidth = 1;
    hb.ctx.strokeRect(0.5, 0.5, 89, 11);
    
    hb.sprite.material.map.needsUpdate = true;
}

function createPlayer() {
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.2,0.6),new THREE.MeshStandardMaterial({color:0x1a237e}));
    body.position.y=0.6; body.castShadow=true; g.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.45,12,12),new THREE.MeshStandardMaterial({color:0xffca28}));
    head.position.y=1.45; head.castShadow=true; g.add(head);
    const gun=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,0.5),new THREE.MeshStandardMaterial({color:0x424242}));
    gun.position.set(0.5,0.9,0.4); g.add(gun);
    g.position.set(0,0,0); scene.add(g);
    
    const hb = createHealthBar(true);
    hb.sprite.position.set(0, 2.8, 0);
    g.add(hb.sprite);
    updateHealthBar(hb, 3);
    
    return {mesh:g, speed:0.12, lastShot:0, shootDelay:300, healthBar: hb, hp: 3};
}

function createEnemy() {
    const g = new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.3,0.6),new THREE.MeshStandardMaterial({color:0x5d1010}));
    body.position.y=0.65; body.castShadow=true; g.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.4,10,10),new THREE.MeshStandardMaterial({color:0x3e2723}));
    head.position.y=1.55; head.castShadow=true; g.add(head);
    const knife=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.4,0.05),new THREE.MeshStandardMaterial({color:0xbdbdbd}));
    knife.position.set(0.5,1,0.4); knife.rotation.x=-0.5; g.add(knife);
    const a=Math.random()*Math.PI*2, rad=45+Math.random()*10;
    g.position.set(Math.cos(a)*rad,0,Math.sin(a)*rad); scene.add(g);
    
    const hb = createHealthBar(false);
    hb.sprite.position.set(0, 2.6, 0);
    hb.sprite.visible = false; // Sembunyi awal
    g.add(hb.sprite);
    updateHealthBar(hb, 2);
    
    return {mesh:g, speed:0.035+(level*0.004), healthBar: hb, hp: 2, lastGroan: 0};
}

function createBullet(pos, yaw) {
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6),new THREE.MeshBasicMaterial({color:0xffff00}));
    m.position.copy(pos); m.position.y=0.9;
    const d=new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0),yaw); scene.add(m);
    return {mesh:m, velocity:d.multiplyScalar(0.5), life:60};
}

// --- FUNGSI MENU & STATE ---
function setCursorVisible(visible) {
    document.body.style.cursor = visible ? 'default' : 'none';
}

function showMenu(title, playText, showHome) {
    document.getElementById('menu-title').innerText = title;
    document.getElementById('btn-play').innerText = playText;
    document.getElementById('btn-home').style.display = showHome ? 'block' : 'none';
    document.getElementById('menu-screen').style.display = 'flex';
    setCursorVisible(true);
    document.exitPointerLock();
    stopBGM();
}

function startGame() {
    if(player) scene.remove(player.mesh);
    bullets.forEach(b => scene.remove(b.mesh));
    enemies.forEach(e => scene.remove(e.mesh));
    player = createPlayer(); bullets = []; enemies = [];
    score = 0; level = 1; spawnRate = 2000; camYaw = 0;
    updateUI();
    document.body.requestPointerLock().then(() => {
        document.getElementById('menu-screen').style.display = 'none';
        setCursorVisible(false);
        gameState = 'PLAYING';
        startBGM();
    }).catch(() => console.warn('Pointer lock ditolak'));
}

function togglePause() {
    if(gameState === 'PLAYING') {
        gameState = 'PAUSED';
        showMenu('GAME DIJEDA', '▶ LANJUTKAN', true);
    } else if (gameState === 'PAUSED') {
        document.body.requestPointerLock().then(() => {
            document.getElementById('menu-screen').style.display = 'none';
            setCursorVisible(false);
            gameState = 'PLAYING';
            startBGM();
        });
    }
}

function goToMainMenu() {
    gameState = 'MENU';
    if(player) scene.remove(player.mesh);
    bullets.forEach(b => scene.remove(b.mesh));
    enemies.forEach(e => scene.remove(e.mesh));
    player = null; bullets = []; enemies = [];
    showMenu('FOREST SHOOTER', '▶ MAINKAN', false);
}

function updateUI(){
    document.getElementById('score-display').innerText = `SKOR: ${score}`;
    document.getElementById('level-display').innerText = `LEVEL: ${level}`;
}

// --- GAME LOOP ---
function animate() {
    requestAnimationFrame(animate);
    if(gameState !== 'PLAYING') { renderer.render(scene, camera); return; }
    
    const now = Date.now();
    let moved = false;
    let nx = player.mesh.position.x, nz = player.mesh.position.z;

    camYaw -= mouseDelta.x * CAM_SENSITIVITY;
    mouseDelta.x = 0;

    const sinY = Math.sin(camYaw), cosY = Math.cos(camYaw);
    if(input.up)    { nx -= sinY*player.speed; nz -= cosY*player.speed; moved=true; }
    if(input.down)  { nx += sinY*player.speed; nz += cosY*player.speed; moved=true; }
    if(input.left)  { nx -= cosY*player.speed; nz += sinY*player.speed; moved=true; }
    if(input.right) { nx += cosY*player.speed; nz -= sinY*player.speed; moved=true; }
    
    if(!checkWall(nx, player.mesh.position.z)) player.mesh.position.x = nx;
    if(!checkWall(player.mesh.position.x, nz)) player.mesh.position.z = nz;

    // BADAN SELALU MENOLEH KE ARAH KAMERA/TEMBAK
    player.mesh.rotation.y = camYaw + Math.PI;

    if(input.shoot && now - player.lastShot > player.shootDelay) {
        player.lastShot = now;
        bullets.push(createBullet(player.mesh.position, camYaw + Math.PI));
        playSound('shoot');
    }

    for(let i = bullets.length-1; i >= 0; i--) {
        bullets[i].mesh.position.add(bullets[i].velocity);
        if(checkWall(bullets[i].mesh.position.x, bullets[i].mesh.position.z, 0.1) || --bullets[i].life <= 0) {
            scene.remove(bullets[i].mesh); bullets.splice(i, 1);
        }
    }

    if(now - lastSpawnTime > spawnRate) {
        lastSpawnTime = now;
        enemies.push(createEnemy());
        if(score > 0 && score % 100 === 0) {
            level++; spawnRate = Math.max(500, spawnRate - 150); updateUI();
        }
    }

    for(let i = enemies.length-1; i >= 0; i--) {
        const e = enemies[i];
        const d = new THREE.Vector3().subVectors(player.mesh.position, e.mesh.position).normalize();
        const nex = e.mesh.position.x + d.x*e.speed;
        const nez = e.mesh.position.z + d.z*e.speed;
        if(!checkWall(nex, nez, 0.6)) { e.mesh.position.x = nex; e.mesh.position.z = nez; }
        e.mesh.rotation.y = Math.atan2(d.x, d.z);

        // VISIBILITAS BAR MUSUH HANYA SAAT DEKAT (< 15 UNIT)
        const distToPlayer = player.mesh.position.distanceTo(e.mesh.position);
        e.healthBar.sprite.visible = distToPlayer < 15;

        if(distToPlayer < 15 && now - e.lastGroan > 2000) {
            e.lastGroan = now; playSound('enemy_groan');
        }

        let hit = false;
        for(let j = bullets.length-1; j >= 0; j--) {
            if(bullets[j].mesh.position.distanceTo(e.mesh.position) < 1.2) {
                scene.remove(bullets[j].mesh); bullets.splice(j, 1); 
                hit = true; playSound('enemy_hit'); break;
            }
        }
        
        if(hit) {
            e.hp--;
            updateHealthBar(e.healthBar, e.hp);
            if(e.hp <= 0) { scene.remove(e.mesh); enemies.splice(i, 1); score += 10; updateUI(); }
            continue; 
        }

        if(distToPlayer < 1.3) {
            scene.remove(e.mesh); enemies.splice(i, 1);
            player.hp--;
            updateHealthBar(player.healthBar, player.hp);
            playSound('player_hurt');
            document.body.style.background = '#300';
            setTimeout(() => document.body.style.background = '#020a02', 100);
            
            if(player.hp <= 0) {
                gameState = 'MENU';
                showMenu('MISI GAGAL', '▶ COBA LAGI', true);
                document.querySelector('#menu-screen .menu-subtext').innerHTML = `Skor Akhir: <b style="color:#ffd700">${score}</b>`;
            }
        }
    }

    const camDist = 7, camHeight = 4.5;
    camera.position.x = player.mesh.position.x + Math.sin(camYaw) * camDist;
    camera.position.z = player.mesh.position.z + Math.cos(camYaw) * camDist;
    camera.position.y = player.mesh.position.y + camHeight;
    camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1.5, player.mesh.position.z);
    renderer.render(scene, camera);
}

// --- EVENT LISTENERS ---
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
window.addEventListener('mousemove', (e) => {
    if(document.pointerLockElement === document.body && gameState === 'PLAYING') mouseDelta.x = e.movementX;
});
window.addEventListener('mousedown', (e) => { if(gameState === 'PLAYING' && e.button === 0) input.shoot = true; });
window.addEventListener('mouseup', (e) => { if(e.button === 0) input.shoot = false; });
window.addEventListener('keydown', (e) => {
    if(e.code === 'KeyW' || e.code === 'ArrowUp') input.up = true;
    if(e.code === 'KeyS' || e.code === 'ArrowDown') input.down = true;
    if(e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = true;
    if(e.code === 'KeyD' || e.code === 'ArrowRight') input.right = true;
    if(e.code === 'Escape' && (gameState === 'PLAYING' || gameState === 'PAUSED')) togglePause();
});
window.addEventListener('keyup', (e) => {
    if(e.code === 'KeyW' || e.code === 'ArrowUp') input.up = false;
    if(e.code === 'KeyS' || e.code === 'ArrowDown') input.down = false;
    if(e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = false;
    if(e.code === 'KeyD' || e.code === 'ArrowRight') input.right = false;
});
document.getElementById('btn-play').addEventListener('click', () => { if(gameState === 'PAUSED') togglePause(); else startGame(); });
document.getElementById('btn-home').addEventListener('click', goToMainMenu);
document.addEventListener('pointerlockchange', () => {
    if(document.pointerLockElement !== document.body && gameState === 'PLAYING') togglePause();
});

showMenu('FOREST SHOOTER', '▶ MAINKAN', false);
animate();
</script>
</body>
</html>
